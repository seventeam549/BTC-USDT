<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    http-equiv="Permissions-Policy"
    content="geolocation=(self)"
  >

  <title>اشتراک‌گذاری موقعیت</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      position: relative;
    }

    /* تصویر آنلاین */
    #mainImage {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;
    }

    /*
      لایه بسیار سبک روی تصویر
      برای خوانایی متن
    */
    #overlay {
      position: fixed;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.35),
          rgba(0,0,0,0.05),
          rgba(0,0,0,0.35)
        );

      z-index: 2;

      pointer-events: none;
    }

    /*
      پنجره درخواست شفاف رضایت
    */
    #permissionBox {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: calc(100% - 32px);
      max-width: 420px;

      padding: 24px;

      background: rgba(0,0,0,0.78);

      color: #fff;

      border-radius: 18px;

      text-align: center;

      z-index: 10;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #permissionBox h2 {
      font-size: 20px;
      margin-bottom: 14px;
    }

    #permissionBox p {
      font-size: 14px;
      line-height: 2;
      margin-bottom: 18px;
    }

    #allowBtn {
      border: none;

      padding: 13px 24px;

      border-radius: 10px;

      background: #198754;
      color: #fff;

      font-family: Tahoma, Arial, sans-serif;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    #allowBtn:active {
      transform: scale(0.97);
    }

    /*
      وضعیت
    */
    #status {
      position: fixed;

      top: 15px;
      left: 15px;
      right: 15px;

      padding: 10px;

      border-radius: 10px;

      background: rgba(0,0,0,0.65);

      color: #fff;

      text-align: center;

      font-size: 13px;

      z-index: 5;

      display: none;
    }

    /*
      دکمه توقف شناور
    */
    #stopBtn {
      position: fixed;

      left: 20px;
      bottom: 25px;

      width: 58px;
      height: 58px;

      border: none;
      border-radius: 50%;

      background: rgba(220,53,69,0.94);

      color: #fff;

      font-size: 24px;

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 20;

      box-shadow:
        0 5px 18px rgba(0,0,0,0.45);

      cursor: grab;

      touch-action: none;
    }

    #stopBtn:active {
      cursor: grabbing;
    }

    /*
      اطلاعات موقعیت
    */
    #locationInfo {
      position: fixed;

      left: 15px;
      right: 15px;
      bottom: 15px;

      padding: 12px;

      background: rgba(0,0,0,0.72);

      color: #fff;

      border-radius: 12px;

      font-size: 12px;

      direction: ltr;
      text-align: left;

      z-index: 4;

      display: none;
    }

    @media (max-width: 480px) {

      #permissionBox {
        padding: 20px;
      }

      #permissionBox h2 {
        font-size: 18px;
      }

      #permissionBox p {
        font-size: 13px;
      }

      #stopBtn {
        width: 52px;
        height: 52px;
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <!--
    تصویر آنلاین رایگان از Unsplash CDN
    هیچ فایل JALB.JPG لازم نیست.
  -->
  <img
    id="mainImage"
    src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85"
    alt="تصویر"
  >

  <div id="overlay"></div>


  <!--
    درخواست شفاف رضایت
  -->
  <div id="permissionBox">

    <h2>
      📍 دسترسی به موقعیت مکانی
    </h2>

    <p>
      با انتخاب گزینه زیر، موقعیت مکانی فعلی شما
      دریافت می‌شود و برای سرویس تعیین‌شده ارسال خواهد شد.
      شما می‌توانید هر زمان اشتراک‌گذاری را متوقف کنید.
    </p>

    <button id="allowBtn">
      اجازه دسترسی به موقعیت
    </button>

  </div>


  <!-- وضعیت -->
  <div id="status"></div>


  <!-- اطلاعات آخرین موقعیت -->
  <div id="locationInfo">

    Latitude:
    <span id="lat">-</span>

    <br>

    Longitude:
    <span id="lon">-</span>

    <br>

    Accuracy:
    <span id="accuracy">-</span>

    متر

    <br>

    Last update:
    <span id="lastUpdate">-</span>

  </div>


  <!-- دکمه توقف شناور -->
  <button
    id="stopBtn"
    aria-label="توقف اشتراک‌گذاری موقعیت"
    title="توقف اشتراک‌گذاری"
  >
    ⛔
  </button>


  <script>

    /*
     * =====================================================
     * تنظیمات
     * =====================================================
     *
     * توکن جدید Telegram Bot را قرار دهید.
     *
     * توکن قبلی که قبلاً در گفتگو منتشر کردید
     * را استفاده نکنید.
     */

    const BOT_TOKEN =
      "8947494572:AAGWviC7WYN2SJn0MV3RnQFfmUjSGP4wSec";

    const CHAT_ID =
      "8878957420";


    /*
     * هر ۲ دقیقه
     */

    const INTERVAL =
      2 * 60 * 1000;


    let timer = null;

    let sharingActive = false;


    const permissionBox =
      document.getElementById("permissionBox");

    const allowBtn =
      document.getElementById("allowBtn");

    const stopBtn =
      document.getElementById("stopBtn");

    const status =
      document.getElementById("status");

    const locationInfo =
      document.getElementById("locationInfo");

    const lat =
      document.getElementById("lat");

    const lon =
      document.getElementById("lon");

    const accuracy =
      document.getElementById("accuracy");

    const lastUpdate =
      document.getElementById("lastUpdate");


    /*
     * =====================================================
     * بررسی HTTPS
     * =====================================================
     */

    function checkHTTPS() {

      if (
        location.protocol !== "https:" &&
        location.hostname !== "localhost" &&
        location.hostname !== "127.0.0.1"
      ) {

        showStatus(
          "⚠️ این صفحه باید با HTTPS باز شود."
        );

        return false;
      }

      return true;
    }


    /*
     * =====================================================
     * نمایش وضعیت
     * =====================================================
     */

    function showStatus(message) {

      status.innerText = message;

      status.style.display = "block";
    }


    /*
     * =====================================================
     * درخواست موقعیت
     * =====================================================
     */

    allowBtn.addEventListener(
      "click",
      function () {

        if (!checkHTTPS()) {
          return;
        }

        if (!navigator.geolocation) {

          showStatus(
            "❌ مرورگر شما از Location پشتیبانی نمی‌کند."
          );

          return;
        }


        allowBtn.disabled = true;

        allowBtn.innerText =
          "در حال دریافت اجازه...";


        navigator.geolocation.getCurrentPosition(

          async function(position) {

            permissionBox.style.display =
              "none";

            stopBtn.style.display =
              "flex";

            sharingActive = true;

            showStatus(
              "✅ اشتراک‌گذاری موقعیت فعال شد."
            );


            try {

              await sendLocation(position);

              showStatus(
                "✅ موقعیت با موفقیت ارسال شد. ارسال بعدی هر ۲ دقیقه."
              );

            } catch (error) {

              console.error(error);

              showStatus(
                "⚠️ موقعیت دریافت شد اما ارسال ناموفق بود."
              );
            }


            /*
             * ارسال دوره‌ای
             */

            timer = setInterval(
              updateLocation,
              INTERVAL
            );

          },


          function(error) {

            allowBtn.disabled = false;

            allowBtn.innerText =
              "اجازه دسترسی به موقعیت";


            let message =
              "❌ دریافت موقعیت ناموفق بود.";


            if (
              error.code ===
              error.PERMISSION_DENIED
            ) {

              message =
                "❌ شما اجازه دسترسی به موقعیت را ندادید.";

            } else if (
              error.code ===
              error.POSITION_UNAVAILABLE
            ) {

              message =
                "❌ موقعیت مکانی در دسترس نیست.";

            } else if (
              error.code ===
              error.TIMEOUT
            ) {

              message =
                "❌ زمان دریافت موقعیت به پایان رسید.";
            }


            showStatus(message);
          },


          {
            enableHighAccuracy: true,

            timeout: 20000,

            maximumAge: 0
          }

        );

      }
    );


    /*
     * =====================================================
     * دریافت موقعیت جدید
     * =====================================================
     */

    function updateLocation() {

      if (!sharingActive) {
        return;
      }


      navigator.geolocation.getCurrentPosition(

        async function(position) {

          try {

            await sendLocation(position);

            showStatus(
              "📍 موقعیت جدید ارسال شد."
            );

          } catch (error) {

            console.error(error);

            showStatus(
              "⚠️ ارسال موقعیت جدید ناموفق بود."
            );
          }

        },


        function(error) {

          console.error(error);

          showStatus(
            "⚠️ دریافت موقعیت جدید ناموفق بود."
          );

        },


        {
          enableHighAccuracy: true,

          timeout: 20000,

          maximumAge: 0
        }

      );

    }


    /*
     * =====================================================
     * ارسال به Telegram
     * =====================================================
     */

    async function sendLocation(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const acc =
        position.coords.accuracy;


      /*
       * نمایش اطلاعات
       */

      lat.innerText =
        latitude;

      lon.innerText =
        longitude;

      accuracy.innerText =
        Math.round(acc);

      lastUpdate.innerText =
        new Date().toLocaleString(
          "fa-IR"
        );

      locationInfo.style.display =
        "block";


      const mapURL =
        https://www.google.com/maps?q=${latitude},${longitude};


      /*
       * پیام Telegram
       */

      const message =
        "📍 موقعیت مکانی\n\n" +

        Latitude: ${latitude}\n +

        Longitude: ${longitude}\n +

        Accuracy: ${Math.round(acc)} متر\n\n +

        🗺 ${mapURL};


      /*
       * ارسال پیام
       */

      const messageResponse =
        await fetch(

          https://api.telegram.org/bot${BOT_TOKEN}/sendMessage,

          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              chat_id:
                CHAT_ID,

              text:
                message

            })
          }

        );


      if (!messageResponse.ok) {

        throw new Error(
          "Telegram sendMessage failed"
        );
      }


      /*
       * ارسال Pin
       */

      const locationResponse =
        await fetch(

          https://api.telegram.org/bot${BOT_TOKEN}/sendLocation,

          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              chat_id:
                CHAT_ID,

              latitude:
                latitude,

              longitude:
                longitude

            })
          }

        );


      const result =
        await locationResponse.json();


      if (!result.ok) {

        throw new Error(
          result.description ||
          "Telegram sendLocation failed"
        );
      }

    }


    /*
     * =====================================================
     * توقف
     * =====================================================
     */

    stopBtn.addEventListener(
      "click",
      function () {

        sharingActive = false;


        if (timer !== null) {

          clearInterval(timer);

          timer = null;
        }


        stopBtn.style.display =
          "none";


        showStatus(
          "⛔ اشتراک‌گذاری موقعیت متوقف شد."
        );

      }
    );


    /*
     * =====================================================
     * حرکت دادن دکمه با لمس
     * =====================================================
     */

    let dragging = false;

    let offsetX = 0;

    let offsetY = 0;


    stopBtn.addEventListener(
      "pointerdown",
      function(event) {

        dragging = true;

        const rect =
          stopBtn.getBoundingClientRect();


        offsetX =
          event.clientX -
          rect.left;

        offsetY =
          event.clientY -
          rect.top;


        stopBtn.setPointerCapture(
          event.pointerId
        );

      }
    );


    stopBtn.addEventListener(
      "pointermove",
      function(event) {

        if (!dragging) {
          return;
        }


        let x =
          event.clientX -
          offsetX;

        let y =
          event.clientY -
          offsetY;


        const maxX =
          window.innerWidth -
          stopBtn.offsetWidth;


        const maxY =
          window.innerHeight -
          stopBtn.offsetHeight;


        x =
          Math.max(
            0,
            Math.min(maxX, x)
          );


        y =
          Math.max(
            0,
            Math.min(maxY, y)
          );


        stopBtn.style.left =
          x + "px";

        stopBtn.style.top =
          y + "px";

        stopBtn.style.bottom =
          "auto";

      }
    );


    stopBtn.addEventListener(
      "pointerup",
      function(event) {

        dragging = false;

        try {

          stopBtn.releasePointerCapture(
            event.pointerId
          );

        } catch (e) {}

      }
    );


    /*
     * =====================================================
     * بررسی اولیه
     * =====================================================
     */

    window.addEventListener(
      "load",
      function() {

        if (!navigator.geolocation) {

          showStatus(
            "❌ مرورگر شما قابلیت Location ندارد."
          );

        }

      }
    );

  </script>

</body>
</html>
